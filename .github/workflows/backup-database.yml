name: Database Backup

on:
  schedule:
    # Run daily at 2:00 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch: # Allow manual triggering

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run database backup
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run backup

      - name: Get backup directory
        id: backup
        run: |
          BACKUP_DIR=$(ls -td backups/2* | head -1)
          echo "dir=$BACKUP_DIR" >> $GITHUB_OUTPUT
          echo "dirname=$(basename $BACKUP_DIR)" >> $GITHUB_OUTPUT

      - name: Verify backup integrity
        run: npm run backup:verify ${{ steps.backup.outputs.dir }}

      - name: Upload to S3
        if: success()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Sync to S3 bucket
        if: success()
        run: |
          aws s3 sync ${{ steps.backup.outputs.dir }} \
            s3://boxcall-backups/database/${{ steps.backup.outputs.dirname }}/ \
            --storage-class STANDARD \
            --sse AES256

      - name: Keep local backups (7 days)
        if: success()
        run: |
          find backups/ -name "2*" -type d -mtime +7 -exec rm -rf {} + || true
          echo "Cleaned up backups older than 7 days"

      - name: Upload backup artifact (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ github.run_number }}
          path: ${{ steps.backup.outputs.dir }}
          retention-days: 7
