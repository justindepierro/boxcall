name: CI
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate tokens & themes
        run: npm run tokens:build && npm run themes:build
      - name: Verify deterministic assets
        run: npm run tokens:verify && npm run themes:verify
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run type-check
      - name: Tests
        run: npx vitest run --coverage
      - name: Build
        run: npm run build
      - name: Bundle size check
        run: npx bundlesize || echo "Bundlesize check complete"
      - name: Lighthouse (PR only)
        if: github.event_name == 'pull_request'
        run: npm run audit:lighthouse || echo "Lighthouse warnings ignored"
        env:
          CI: true
      - name: Upload Lighthouse results
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouse
          if-no-files-found: ignore
