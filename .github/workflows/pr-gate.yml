name: PR Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-gate:
    name: PR Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: 🔍 Type Check
        id: typecheck
        run: npm run type-check

      - name: 🧹 Lint Check
        id: lint
        run: npm run lint

      - name: 🧪 Run Unit Tests
        id: test
        run: npm run test:ci
        env:
          NODE_OPTIONS: --max-old-space-size=2048

      - name: 📦 Build Check
        id: build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: 🚦 Perf Budgets (Vite manifest)
        id: perf
        run: npm run perf:budgets

      - name: 📊 Generate PR Comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const typecheck = '${{ steps.typecheck.outcome }}';
            const lint = '${{ steps.lint.outcome }}';
            const test = '${{ steps.test.outcome }}';
            const build = '${{ steps.build.outcome }}';
            const perf = '${{ steps.perf.outcome }}';

            const emoji = (status) => status === 'success' ? '✅' : '❌';

            const comment = `## 🚦 PR Quality Gate Results

            | Check | Status |
            |-------|--------|
            | Type Check | ${emoji(typecheck)} ${typecheck} |
            | Lint | ${emoji(lint)} ${lint} |
            | Tests | ${emoji(test)} ${test} |
            | Build | ${emoji(build)} ${build} |
            | Perf Budgets | ${emoji(perf)} ${perf} |

            ${lint === 'failure' ? '⚠️ **Lint errors detected.** Run `npm run lint` locally to see details.' : ''}
            ${test === 'failure' ? '⚠️ **Tests failing.** Run `npm run test` locally to debug.' : ''}
            ${build === 'failure' ? '⚠️ **Build failed.** Check build logs for errors.' : ''}
            ${perf === 'failure' ? '⚠️ **Perf budgets exceeded.** Run `npm run build:only && npm run perf:budgets` locally to see details.' : ''}
            ${typecheck === 'success' && lint === 'success' && test === 'success' && build === 'success' ? '🎉 **All checks passed!** Ready to merge.' : ''}

            ---
            📚 [Design System Lockdown Progress](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/docs/DESIGN_SYSTEM_LOCKDOWN.md)
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: ❌ Fail if any check failed
        if: steps.typecheck.outcome != 'success' || steps.lint.outcome != 'success' || steps.test.outcome != 'success' || steps.build.outcome != 'success' || steps.perf.outcome != 'success'
        run: exit 1
