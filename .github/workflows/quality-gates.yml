name: Quality Gates

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  quality-checks:
    name: Quality Checks (Type + Lint + Test + Build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type Check
        run: npm run type-check

      - name: Lint
        run: npm run lint
        continue-on-error: false

      - name: Run Tests
        run: npm run test
        continue-on-error: true # Temporarily non-blocking due to storybook test memory issues
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 7

  accessibility-audit:
    name: Accessibility Audit (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality-checks
    if: false # Disabled until test:a11y script is created

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run accessibility tests
        run: npm run test:a11y || echo "⚠️ Accessibility tests not yet configured"
        continue-on-error: true

  style-gate:
    name: Style Gate (Prettier + Token Compliance)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check Prettier formatting
        run: npm run format:check || echo "⚠️ Run 'npm run format' locally"
        continue-on-error: true # Non-blocking until formatting cleanup is done

      - name: Design Token Coverage Report
        run: |
          echo "📊 Design Token Compliance:"
          echo "Current errors: $(npm run lint 2>&1 | grep -o '[0-9]* errors' | grep -o '[0-9]*' || echo '0')"
          echo "Target: < 100 errors by end of Phase 2"
          echo "See DESIGN_SYSTEM_LOCKDOWN.md for roadmap"

  security-audit:
    name: Security Audit (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Run security audit
        run: npm audit --audit-level=moderate || echo "⚠️ Security vulnerabilities found"
        continue-on-error: true
