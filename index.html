<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Mobile viewport optimization -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="theme-color" content="#1e40af" />
    <!-- iOS Safari optimizations -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BoxCall" />
    <!-- Disable automatic detection of phone numbers -->
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="BoxCall - The comprehensive football program management platform. Everything Hudl is not."
    />

    <!-- Self-hosted font preloads - Only critical fonts -->
    <!-- Inter-400 and Inter-600 are used immediately in body text and headings -->
    <link
      rel="preload"
      href="/assets/fonts/Inter-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/Inter-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Other fonts loaded on demand
    <link
      rel="preload"
      href="/assets/fonts/Inter-500.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/Jetbrains-Mono-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    -->

    <title>BoxCall - Football Management Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
