<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoxCall Supabase Debug</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 800px;
        margin: 40px auto;
        padding: 20px;
        background: #1a1a2e;
        color: #eee;
      }
      h1 {
        color: #10b981;
      }
      button {
        background: #10b981;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        margin: 8px;
      }
      button:hover {
        background: #059669;
      }
      button:disabled {
        background: #666;
        cursor: not-allowed;
      }
      pre {
        background: #0d0d1a;
        padding: 16px;
        border-radius: 8px;
        overflow-x: auto;
        max-height: 400px;
        overflow-y: auto;
      }
      .success {
        color: #10b981;
      }
      .error {
        color: #ef4444;
      }
      .warning {
        color: #f59e0b;
      }
      .info {
        color: #3b82f6;
      }
      #output {
        white-space: pre-wrap;
        word-break: break-word;
      }
      .test-section {
        margin: 20px 0;
        padding: 16px;
        background: #16213e;
        border-radius: 8px;
      }
      .test-section h3 {
        margin-top: 0;
        color: #3b82f6;
      }
    </style>
  </head>
  <body>
    <h1>🏈 BoxCall Supabase Debug</h1>
    <p>This page tests Supabase connectivity without the complex auth-store.</p>

    <div class="test-section">
      <h3>Quick Actions</h3>
      <button onclick="runAllTests()">🧪 Run All Tests</button>
      <button onclick="testRawFetch()">📡 Test Raw Fetch</button>
      <button onclick="testSupabaseClient()">🔌 Test Supabase Client</button>
      <button onclick="clearOutput()">🗑️ Clear</button>
    </div>

    <div class="test-section">
      <h3>Auth Actions</h3>
      <button onclick="checkSession()">🔐 Check Session</button>
      <button onclick="manualLogin()">📧 Login</button>
      <button onclick="logout()">🚪 Logout</button>
    </div>

    <pre id="output">Click a button to start testing...</pre>

    <script type="module">
      // Import Supabase directly (ES modules)
      import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

      const SUPABASE_URL = "https://lvmuiqwihlpnwppdqqfl.supabase.co";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx2bXVpcXdpaGxwbndwcGRxcWZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTIwMjIzNDgsImV4cCI6MjA2NzU5ODM0OH0.3SreGdPAJ2J5XcQVbNIbzK378j15ZJnwQqscBE2HkII";

      const output = document.getElementById("output");

      // Create Supabase client with SAME storage key as main app
      let supabase;
      try {
        supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            storageKey: "boxcall-auth", // SAME key as main app to test real scenario
          },
        });
        log(
          "✅ Supabase client created (using boxcall-auth storage)",
          "success"
        );
      } catch (err) {
        log("❌ Failed to create Supabase client: " + err.message, "error");
      }

      function log(msg, type = "info") {
        const timestamp = new Date().toLocaleTimeString();
        const colorClass = type;
        output.innerHTML += `<span class="${colorClass}">[${timestamp}] ${msg}</span>\n`;
        output.scrollTop = output.scrollHeight;
        console.log(`[${type}]`, msg);
      }

      function clearOutput() {
        output.innerHTML = "";
      }

      window.clearOutput = clearOutput;

      // Test 1: Raw fetch to Supabase REST API (bypasses JS client entirely)
      async function testRawFetch() {
        log("\n📡 Testing RAW FETCH to Supabase REST API...", "info");

        try {
          const authData = localStorage.getItem("boxcall-auth");
          let accessToken = null;

          if (authData) {
            const parsed = JSON.parse(authData);
            accessToken = parsed.access_token;
            log(
              `Found access token in localStorage (expires: ${parsed.expires_at})`,
              "info"
            );
          }

          const headers = {
            apikey: SUPABASE_ANON_KEY,
            "Content-Type": "application/json",
          };

          if (accessToken) {
            headers["Authorization"] = `Bearer ${accessToken}`;
          }

          log("Fetching profiles...", "info");
          const start = Date.now();
          const response = await fetch(
            `${SUPABASE_URL}/rest/v1/profiles?select=id,full_name,role&limit=3`,
            { headers }
          );
          const elapsed = Date.now() - start;

          if (!response.ok) {
            const errorText = await response.text();
            log(`❌ Fetch failed (${response.status}): ${errorText}`, "error");
            return;
          }

          const data = await response.json();
          log(`✅ Raw fetch SUCCESS in ${elapsed}ms!`, "success");
          log(`   Found ${data.length} profiles`, "success");
          data.forEach((p) => log(`   - ${p.full_name} (${p.role})`, "info"));
        } catch (err) {
          log(`❌ Raw fetch error: ${err.message}`, "error");
        }
      }
      window.testRawFetch = testRawFetch;

      // Test 2: Supabase JS Client (this is what might be hanging)
      async function testSupabaseClient() {
        log("\n🔌 Testing SUPABASE JS CLIENT...", "info");

        if (!supabase) {
          log("❌ Supabase client not initialized", "error");
          return;
        }

        try {
          // Test 1: getSession (this was hanging)
          log("Testing getSession()...", "info");
          const sessionStart = Date.now();

          const sessionPromise = supabase.auth.getSession();
          const timeoutPromise = new Promise((_, reject) =>
            setTimeout(() => reject(new Error("TIMEOUT after 5s")), 5000)
          );

          const {
            data: { session },
            error: sessionError,
          } = await Promise.race([sessionPromise, timeoutPromise]).catch(
            (err) => ({
              data: { session: null },
              error: { message: err.message },
            })
          );

          const sessionElapsed = Date.now() - sessionStart;

          if (sessionError) {
            log(
              `⚠️ getSession returned error in ${sessionElapsed}ms: ${sessionError.message}`,
              "warning"
            );
          } else {
            log(`✅ getSession completed in ${sessionElapsed}ms`, "success");
            log(
              `   Session: ${session ? "Found" : "None"}`,
              session ? "success" : "warning"
            );
          }

          // Test 2: Query database
          log("Testing database query (profiles)...", "info");
          const queryStart = Date.now();

          const queryPromise = supabase
            .from("profiles")
            .select("id,full_name")
            .limit(3);
          const queryTimeoutPromise = new Promise((_, reject) =>
            setTimeout(() => reject(new Error("QUERY TIMEOUT after 5s")), 5000)
          );

          const { data: profiles, error: queryError } = await Promise.race([
            queryPromise,
            queryTimeoutPromise,
          ]).catch((err) => ({ data: null, error: { message: err.message } }));

          const queryElapsed = Date.now() - queryStart;

          if (queryError) {
            log(
              `❌ Query failed in ${queryElapsed}ms: ${queryError.message}`,
              "error"
            );
          } else {
            log(`✅ Query completed in ${queryElapsed}ms`, "success");
            log(`   Found ${profiles?.length || 0} profiles`, "success");
          }
        } catch (err) {
          log(`❌ Supabase client error: ${err.message}`, "error");
        }
      }
      window.testSupabaseClient = testSupabaseClient;

      // Test 3: Check session directly
      async function checkSession() {
        log("\n🔐 Checking auth session...", "info");

        // Check localStorage
        const boxcallAuth = localStorage.getItem("boxcall-auth");
        const debugAuth = localStorage.getItem("boxcall-debug-auth");

        log(
          `boxcall-auth in localStorage: ${boxcallAuth ? "YES" : "NO"}`,
          boxcallAuth ? "success" : "warning"
        );
        log(
          `boxcall-debug-auth in localStorage: ${debugAuth ? "YES" : "NO"}`,
          debugAuth ? "success" : "warning"
        );

        if (boxcallAuth) {
          try {
            const parsed = JSON.parse(boxcallAuth);
            const expiresAt = parsed.expires_at;
            const now = Math.floor(Date.now() / 1000);
            const isExpired = expiresAt && expiresAt < now;

            log(
              `   expires_at: ${expiresAt} (${new Date(expiresAt * 1000).toLocaleString()})`,
              "info"
            );
            log(`   Current time: ${now}`, "info");
            log(
              `   Token ${isExpired ? "EXPIRED" : "VALID"} (${isExpired ? "" : "expires in " + (expiresAt - now) + "s"}`,
              isExpired ? "error" : "success"
            );

            if (parsed.user) {
              log(`   User: ${parsed.user.email}`, "success");
              log(`   User ID: ${parsed.user.id}`, "info");
            }
          } catch (e) {
            log(`   Could not parse boxcall-auth: ${e.message}`, "error");
          }
        }

        // Try getSession
        if (supabase) {
          log("Calling supabase.auth.getSession()...", "info");
          try {
            const start = Date.now();
            const { data, error } = await Promise.race([
              supabase.auth.getSession(),
              new Promise((_, reject) =>
                setTimeout(() => reject(new Error("TIMEOUT")), 5000)
              ),
            ]);
            const elapsed = Date.now() - start;

            if (error) {
              log(`❌ getSession error: ${error.message}`, "error");
            } else {
              log(`✅ getSession completed in ${elapsed}ms`, "success");
              log(
                `   Has session: ${!!data.session}`,
                data.session ? "success" : "warning"
              );
            }
          } catch (err) {
            log(`❌ getSession failed: ${err.message}`, "error");
          }
        }
      }
      window.checkSession = checkSession;

      // Manual login
      async function manualLogin() {
        const email = prompt("Enter email:");
        const password = prompt("Enter password:");

        if (!email || !password) {
          log("Login cancelled", "warning");
          return;
        }

        log(`\n📧 Attempting login as ${email}...`, "info");

        try {
          const { data, error } = await supabase.auth.signInWithPassword({
            email,
            password,
          });

          if (error) {
            log(`❌ Login failed: ${error.message}`, "error");
          } else {
            log(`✅ Login successful!`, "success");
            log(`   User: ${data.user.email}`, "success");
            log(`   Session expires: ${data.session.expires_at}`, "info");
          }
        } catch (err) {
          log(`❌ Login error: ${err.message}`, "error");
        }
      }
      window.manualLogin = manualLogin;

      // Logout
      async function logout() {
        log("\n🚪 Logging out...", "info");

        try {
          await supabase.auth.signOut();
          log("✅ Signed out from debug client", "success");

          // Also clear the main app's storage
          localStorage.removeItem("boxcall-auth");
          localStorage.removeItem("boxcall-auth-cache");
          log("✅ Cleared boxcall-auth from localStorage", "success");
        } catch (err) {
          log(`❌ Logout error: ${err.message}`, "error");
        }
      }
      window.logout = logout;

      // Run all tests
      async function runAllTests() {
        clearOutput();
        log("🧪 Running all tests...\n", "info");

        await testRawFetch();
        await testSupabaseClient();
        await checkSession();

        log("\n✅ All tests complete!", "success");
      }
      window.runAllTests = runAllTests;

      // Auto-run on load
      log("🏈 BoxCall Debug Page Ready", "success");
      log("Using Supabase URL: " + SUPABASE_URL, "info");
      log("", "info");
    </script>
  </body>
</html>
