<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BoxCall - Professional Football Management Platform for Teams, Coaches, and Players"
    />
    <meta
      name="keywords"
      content="football, coaching, team management, playbooks, analytics, sports"
    />
    <meta name="author" content="BoxCall Team" />

    <!-- Open Graph meta tags for social sharing -->
    <meta
      property="og:title"
      content="BoxCall - Football Management Platform"
    />
    <meta
      property="og:description"
      content="Professional Football Management Platform for Teams, Coaches, and Players"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://boxcall.app" />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter Card meta tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="BoxCall - Football Management Platform"
    />
    <meta
      name="twitter:description"
      content="Professional Football Management Platform for Teams, Coaches, and Players"
    />
    <meta name="twitter:image" content="/twitter-image.png" />

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#2d5a27" />
    <meta name="msapplication-TileColor" content="#2d5a27" />

    <!-- Apple Web App meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BoxCall" />

    <!-- Preconnects: none needed for fonts; they are self-hosted now -->

    <!-- Security headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />

    <title>BoxCall - Football Management Platform</title>
  </head>
  <body>
    <noscript>
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          font-family:
            -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto,
            sans-serif;
          text-align: center;
          padding: 2rem;
          background-color: #f8f9fa;
          color: #333;
        "
      >
        <h1 style="color: #2d5a27; margin-bottom: 1rem">BoxCall</h1>
        <h2 style="margin-bottom: 1rem">JavaScript Required</h2>
        <p style="max-width: 400px; line-height: 1.6; margin-bottom: 1rem">
          BoxCall requires JavaScript to run. Please enable JavaScript in your
          browser settings and reload this page to continue.
        </p>
        <p style="font-size: 0.9rem; color: #666">
          If you're having trouble, please contact our support team.
        </p>
      </div>
    </noscript>

    <!-- Main application root -->
    <div id="root">
      <!-- Loading screen while app initializes -->
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          font-family:
            -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto,
            sans-serif;
          background-color: #2d5a27;
          color: white;
        "
      >
        <div
          style="
            width: 60px;
            height: 60px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 1rem;
          "
        ></div>
        <h1 style="margin: 0; font-size: 2rem; font-weight: 700">BoxCall</h1>
        <p style="margin: 0.5rem 0 0 0; opacity: 0.8">Loading...</p>
      </div>

      <style>
        @keyframes spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
    </div>

    <!-- Application scripts will be injected here by Vite -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
