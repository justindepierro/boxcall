<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tooltip Debug Test</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 100px;
      background: #f5f5f5;
    }
    
    .tooltip-wrapper {
      position: relative;
      display: inline-flex;
    }
    
    .tooltip {
      position: absolute;
      z-index: 9999;
      background: #1f2937;
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      pointer-events: none;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      white-space: nowrap;
    }
    
    .tooltip-top {
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
    }
    
    .tooltip-arrow {
      position: absolute;
      width: 8px;
      height: 8px;
      background: #1f2937;
      transform: rotate(45deg);
    }
    
    .tooltip-top .tooltip-arrow {
      bottom: -4px;
      left: 50%;
      margin-left: -4px;
    }
    
    button {
      padding: 12px 24px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
    
    button:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <h1>Pure HTML/CSS/JS Tooltip Test</h1>
  <p>This tests if the basic tooltip pattern works at all</p>
  
  <div class="tooltip-wrapper" id="test1">
    <button>Hover me!</button>
    <div class="tooltip tooltip-top" style="display: none;">
      Hello! I am a tooltip 👋
      <div class="tooltip-arrow"></div>
    </div>
  </div>
  
  <script>
    const wrapper = document.getElementById('test1');
    const button = wrapper.querySelector('button');
    const tooltip = wrapper.querySelector('.tooltip');
    
    let timeout;
    
    button.addEventListener('mouseenter', () => {
      console.log('Mouse enter');
      timeout = setTimeout(() => {
        console.log('Showing tooltip');
        tooltip.style.display = 'block';
      }, 140);
    });
    
    button.addEventListener('mouseleave', () => {
      console.log('Mouse leave');
      clearTimeout(timeout);
      tooltip.style.display = 'none';
    });
  </script>
</body>
</html>
