Catastrophic (fix immediately)
	1.	Secrets exposure risk
	•	.env.local included. Treat this as compromised. Rotate Supabase keys and any other tokens that ever lived in that file. Re-confirm .gitignore rules and artifact pipelines so env files never ship again.
	2.	Budgets without enforcement
	•	If Lighthouse/bundle budgets don’t fail CI, a perf regression can sneak into production right before a demo. Add hard gates.
	3.	DB/migrations if manual
	•	If schema changes are not locked by migrations + review, one errant console run can brick prod data (especially with role/permission changes). Confirm migration rigor.

