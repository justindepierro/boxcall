Concrete “do this next” checklist (quick wins in ~1–2 sessions)

Security
	•	Rotate Supabase keys.
	•	Ensure .env* never leaves local/CI vaults; verify .gitignore and your build artifact process.

CI/CD (GitHub Actions or similar)
	•	Type-check + lint + test on PRs (fail on any error).
	•	Bundle-size check (e.g., bundlesize or @bundle-stats/cli) with hard thresholds.
	•	Lighthouse CI on a built preview with budgets from lighthouserc.json.
	•	Vitest coverage thresholds (e.g., 80–90%)—fail build if violated.
	•	Knip dead code check in CI.
	•	Optional but excellent: Playwright a11y smoke (axe) on top user flows (login → open playbook → render 6 cards).

Performance
	•	Route-level code splitting (React.lazy) for Playbook, Dashboard, Team pages, Practice Planner, etc.
	•	Split heavy utilities (pdf renderer, diagram tools, rich editors) into async chunks.
	•	Preload only active theme; lazy-load additional theme token files on switch.
	•	Turn on build.ssrEmitAssets (if SSR later) and strict asset hashing/caching.

Architecture
	•	Enforce your intended modular layout (you already have it):
features/{auth,team,playbook,practice}/, shared/{ui,components,lib}, services/, types/.
	•	Cap file size: split any file > 500–800 LOC (you flagged a few in the checklist).
	•	Introduce a tiny domain event bus (Pub/Sub) so Practice/Game/Playbook don’t tangle.

DX
	•	Add npm run ci that runs: type-check → lint → test → knip → bundlesize → lighthouse-ci.
	•	Add pre-commit hook for ESLint/Prettier, pre-push hook for type-check + unit tests.
	•	Create docs/CONTRIBUTING.md: branch naming, PR size limits, commit style, review gates.

