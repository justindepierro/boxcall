Performance plan (specific cuts)
	•	PDF & media: Your budget report cites a pdfRenderer-*.js ~498 KB chunk.
	•	Move PDF code behind a lazy import and show a skeleton while loading.
	•	If it’s a third-party viewer, consider a lite alternative or worker-based parsing.
	•	Editor/diagram dependencies: If you use a canvas/diagram library, isolate it. Lazy load on first expand of a play card or when entering “Edit” mode.
	•	Icons: Ensure tree-shaken import (lucide-react with direct icon imports).
	•	Date/utils: If using moment/lodash, swap to dayjs + per-method lodash-es.
	•	Images/fonts:
	•	Preload only the active theme font files; defer others.
	•	Add font-display: swap; consider subset fonts for headings vs body.

