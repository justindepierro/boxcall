Professional environment hardening

GitHub Actions (example skeleton)

name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test -- --coverage
      - run: npm run knip:ci
      - run: npm run build
      - run: npm run bundlesize:ci
      - run: npm run lhci:ci

Wire your existing scripts to these commands:
	•	bundlesize:ci → reads thresholds and exits non-zero on breach.
	•	lhci:ci → uses lighthouserc.json budgets.

Vitest coverage gate (package.json)

{
  "vitest": {
    "coverage": {
      "provider": "v8",
      "reportsDirectory": "coverage",
      "lines": 0.8,
      "functions": 0.8,
      "branches": 0.8,
      "statements": 0.8
    }
  }
}

